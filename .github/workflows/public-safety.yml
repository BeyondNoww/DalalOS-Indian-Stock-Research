name: Public repository safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Reject implementation files, private-repo references, and obvious credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [p for p in tracked if p]

          exact_allowed = {
              "README.md",
              "SECURITY.md",
              "CONTRIBUTING.md",
              "server.json",
              "capabilities.json",
              "LICENSE",
              "NOTICE",
              ".github/CODEOWNERS",
              ".github/pull_request_template.md",
              ".github/workflows/public-safety.yml",
          }

          def allowed_path(path: str) -> bool:
              if path in exact_allowed:
                  return True
              if path.startswith("docs/") and path.endswith(".md"):
                  return True
              if path.startswith("examples/") and path.endswith(".md"):
                  return True
              return False

          failures = []
          unexpected = [p for p in tracked if not allowed_path(p)]
          if unexpected:
              failures.append(
                  "unexpected tracked files outside the docs/metadata allowlist: "
                  + ", ".join(sorted(unexpected))
              )

          # Build sensitive private-repo identifiers from fragments so this workflow does not
          # contain the exact strings it is looking for in public documentation.
          private_repo_names = [
              "indianstock" + "-data-mcp",
              "dalal" + "-os",
              "dalalos" + "-content-engine",
          ]

          secret_patterns = [
              re.compile(r"\bghp_[A-Za-z0-9]{20,}\b"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\bisk_live_[A-Za-z0-9_-]{8,}\b"),
              re.compile(r"\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b"),
              re.compile(r"Authorization:\s*Bearer\s+(?!<)[A-Za-z0-9._~-]{20,}", re.I),
          ]

          scan_skip = {".github/workflows/public-safety.yml"}
          for path in tracked:
              if path in scan_skip:
                  continue
              p = pathlib.Path(path)
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  failures.append(f"non-text or unreadable tracked file: {path}")
                  continue

              lowered = text.lower()
              for private_name in private_repo_names:
                  if private_name.lower() in lowered:
                      failures.append(f"private repository identifier found in {path}")
                      break

              for pattern in secret_patterns:
                  if pattern.search(text):
                      failures.append(f"possible live credential found in {path}: {pattern.pattern}")
                      break

          capability_path = pathlib.Path("capabilities.json")
          if capability_path.exists():
              try:
                  capability = json.loads(capability_path.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, OSError) as exc:
                  failures.append(f"capabilities.json is unreadable JSON: {exc}")
              else:
                  root_keys = {
                      "deprecated_tool_count",
                      "preferred_tool_count",
                      "registered_tool_count",
                      "schema_version",
                      "service",
                      "tools",
                      "write_tool_count",
                  }
                  tool_keys = {"deprecated", "destructive", "name", "read_only", "successor"}
                  if set(capability) != root_keys:
                      failures.append("capabilities.json root keys differ from the public allowlist")
                  tools = capability.get("tools")
                  if not isinstance(tools, list):
                      failures.append("capabilities.json tools must be a list")
                      tools = []
                  if any(not isinstance(tool, dict) or set(tool) != tool_keys for tool in tools):
                      failures.append("capabilities.json tool keys differ from the public allowlist")

                  names = [tool.get("name") for tool in tools if isinstance(tool, dict)]
                  if names != sorted(names) or len(names) != len(set(names)):
                      failures.append("capabilities.json tool names must be unique and sorted")

                  deprecated = [tool for tool in tools if tool.get("deprecated") is True]
                  writes = [tool for tool in tools if tool.get("read_only") is False]
                  preferred = [tool for tool in tools if tool.get("deprecated") is False]
                  if capability.get("registered_tool_count") != len(tools):
                      failures.append("capabilities.json registered_tool_count is inconsistent")
                  if capability.get("preferred_tool_count") != len(preferred):
                      failures.append("capabilities.json preferred_tool_count is inconsistent")
                  if capability.get("deprecated_tool_count") != len(deprecated):
                      failures.append("capabilities.json deprecated_tool_count is inconsistent")
                  if capability.get("write_tool_count") != len(writes):
                      failures.append("capabilities.json write_tool_count is inconsistent")

                  write_names = {tool.get("name") for tool in writes}
                  if write_names != {"add_to_watchlist", "remove_from_watchlist"}:
                      failures.append("capabilities.json exposes an unexpected write capability")
                  deprecated_map = {tool.get("name"): tool.get("successor") for tool in deprecated}
                  if deprecated_map != {
                      "get_fii_activity": "get_stock_fii_flow",
                      "get_fii_dii_flow": "get_market_fii_dii_flow",
                  }:
                      failures.append("capabilities.json deprecated aliases differ from the public contract")
                  if capability.get("schema_version") != 1 or capability.get("service") != "DalalOS":
                      failures.append("capabilities.json identity/schema is unexpected")

          if failures:
              print("Public repository safety validation failed:", file=sys.stderr)
              for failure in failures:
                  print(f"- {failure}", file=sys.stderr)
              sys.exit(1)

          print(f"Validated {len(tracked)} tracked public metadata/documentation files.")
          PY
